{% extends "base.html" %}

{% block title %}Log in — Sri Laxmi Silver{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="auth-card">

        <div class="brand">
            <div class="brand-mark">S</div>
            <span>Sri Laxmi Silver</span>
        </div>

        <div class="auth-header">
            <h1>Welcome back</h1>
            <p>Log in to continue with Sri Laxmi Silver.</p>
        </div>

        <form method="POST" class="auth-form">
            <input type="hidden" name="next" value="{{ next_url }}">

            <div class="form-group">
                <label for="email">Email</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="you@example.com"
                    autocomplete="email"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >
            </div>

            <button type="submit" class="primary-button">
                Log in
            </button>

        </form>

        <p class="auth-footer">
            Don't have an account?
            <a href="{{ url_for('auth.register', next=next_url) }}">Create one</a>
        </p>

    </div>
</div>
{% endblock %}
